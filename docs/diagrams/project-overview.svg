<svg viewBox="0 0 1400 1500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6370"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1500" fill="#f7f8fa"/>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1d23">RxFlow — What Was Built</text>
  <text x="700" y="64" text-anchor="middle" font-size="14" fill="#5b6370">Reference system for the FDE Intermediate-to-Advanced course · github.com/venkatesh-db/rxflow</text>

  <!-- ============ SECTION 1: SYSTEM ARCHITECTURE ============ -->
  <text x="40" y="105" font-size="16" font-weight="700" fill="#1a1d23">1. System architecture (Phase 0-1)</text>

  <!-- order-service -->
  <rect x="60" y="125" width="220" height="100" rx="10" fill="#e8f0fe" stroke="#3b6ec2" stroke-width="1.5"/>
  <text x="170" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">order-service</text>
  <text x="170" y="170" text-anchor="middle" font-size="11" fill="#3b3f45">POST /orders (intake)</text>
  <text x="170" y="186" text-anchor="middle" font-size="11" fill="#3b3f45">confirm — FAIL-CLOSED</text>
  <text x="170" y="202" text-anchor="middle" font-size="10" fill="#8a1f11" font-style="italic">bug found+fixed: intake</text>
  <text x="170" y="215" text-anchor="middle" font-size="10" fill="#8a1f11" font-style="italic">now rolls back on failure</text>

  <!-- lab-router -->
  <rect x="330" y="125" width="220" height="100" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="440" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">lab-router</text>
  <text x="440" y="170" text-anchor="middle" font-size="11" fill="#3b3f45">polls routing queue</text>
  <text x="440" y="186" text-anchor="middle" font-size="11" fill="#3b3f45">assigns eligible lab</text>
  <text x="440" y="205" text-anchor="middle" font-size="10" fill="#8a1f11" font-weight="700">SEED-005: no idempotency</text>
  <text x="440" y="218" text-anchor="middle" font-size="10" fill="#8a1f11">check — redelivery = double-route</text>

  <!-- analytics-pipeline -->
  <rect x="600" y="125" width="220" height="100" rx="10" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="710" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">analytics-pipeline</text>
  <text x="710" y="170" text-anchor="middle" font-size="11" fill="#3b3f45">polls analytics queue</text>
  <text x="710" y="186" text-anchor="middle" font-size="11" fill="#3b3f45">FAIL-OPEN by design</text>
  <text x="710" y="205" text-anchor="middle" font-size="10" fill="#3b3f45">malformed msg → log + skip,</text>
  <text x="710" y="218" text-anchor="middle" font-size="10" fill="#3b3f45">never blocks the queue</text>

  <!-- ops-mcp-server -->
  <rect x="870" y="125" width="250" height="100" rx="10" fill="#fef6e0" stroke="#b7860b" stroke-width="1.5"/>
  <text x="995" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">ops-mcp-server</text>
  <text x="995" y="170" text-anchor="middle" font-size="11" fill="#3b3f45">5 tools · 3 structurally gated</text>
  <text x="995" y="186" text-anchor="middle" font-size="10" fill="#8a1f11" font-weight="700">SEED-002: refund_order has</text>
  <text x="995" y="199" text-anchor="middle" font-size="10" fill="#8a1f11">no store-ownership check</text>
  <text x="995" y="215" text-anchor="middle" font-size="10" fill="#8a1f11" font-weight="700">SEED-006: bad call = 0 audit rows</text>

  <!-- shared-db -->
  <rect x="380" y="270" width="360" height="60" rx="10" fill="#eef0f3" stroke="#5b6370" stroke-width="1.5"/>
  <text x="560" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">shared-db</text>
  <text x="560" y="313" text-anchor="middle" font-size="11" fill="#3b3f45">SQLite · orders · queue_messages · analytics_events · audit_log</text>

  <!-- connecting lines to shared-db -->
  <path d="M170,225 L170,300 L380,300" fill="none" stroke="#5b6370" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M440,225 L440,300 L380,300" fill="none" stroke="#5b6370" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M710,225 L710,300 L740,300" fill="none" stroke="#5b6370" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M995,225 L995,300 L740,300" fill="none" stroke="#5b6370" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ SECTION 2: BUILD PHASES ============ -->
  <text x="40" y="380" font-size="16" font-weight="700" fill="#1a1d23">2. Build phases (all complete, tagged v1.0)</text>

  <!-- Phase boxes -->
  <g font-size="12">
    <rect x="60" y="400" width="1290" height="46" rx="8" fill="#ffffff" stroke="#d5d9de"/>
    <text x="75" y="428" font-weight="700" fill="#1a1d23">Phase 0-1</text>
    <text x="175" y="428" fill="#3b3f45">4 services + shared SQLite schema built and run · 10-item seed-manifest.md written, every item verified live (not just asserted)</text>

    <rect x="60" y="454" width="1290" height="46" rx="8" fill="#ffffff" stroke="#d5d9de"/>
    <text x="75" y="482" font-weight="700" fill="#1a1d23">Phase 2</text>
    <text x="175" y="482" fill="#3b3f45">Day 1-2 lab templates (enforcement-design-note.md, fail-closed-comparison-memo.md) · SEED-006 reproduced, manifest corrected to match real behavior</text>

    <rect x="60" y="508" width="1290" height="46" rx="8" fill="#ffffff" stroke="#d5d9de"/>
    <text x="75" y="536" font-weight="700" fill="#1a1d23">Phase 3</text>
    <text x="175" y="536" fill="#3b3f45">.github/workflows/pr-review.yml (advisory-only, permission-scoped) · 3 of 4 sub-agents pre-authored in .claude/agents/</text>

    <rect x="60" y="562" width="1290" height="46" rx="8" fill="#ffffff" stroke="#d5d9de"/>
    <text x="75" y="590" font-weight="700" fill="#1a1d23">Phase 4</text>
    <text x="175" y="590" fill="#3b3f45">chaos/incident-1.sh + incident-2.sh + reset.sh — both incidents proven to reproduce reliably · found + fixed a real crash bug along the way</text>

    <rect x="60" y="616" width="1290" height="46" rx="8" fill="#ffffff" stroke="#d5d9de"/>
    <text x="75" y="644" font-weight="700" fill="#1a1d23">Phase 5</text>
    <text x="175" y="644" fill="#3b3f45">8 golden tasks (scored rubrics) + run-eval.sh harness + 3 governance templates (audit / approval / rollback), all against real repo state</text>

    <rect x="60" y="670" width="1290" height="46" rx="8" fill="#ffffff" stroke="#d5d9de"/>
    <text x="75" y="698" font-weight="700" fill="#1a1d23">Phase 6</text>
    <text x="175" y="698" fill="#3b3f45">Technical dry run · calibration-notes.md · git-tagged v1.0 · pushed to github.com/venkatesh-db/rxflow</text>
  </g>

  <!-- ============ SECTION 3: VERIFICATION PASSES ============ -->
  <text x="40" y="750" font-size="16" font-weight="700" fill="#1a1d23">3. Verification passes (things caught by actually testing, not assuming)</text>

  <!-- Live CI verification -->
  <rect x="60" y="770" width="410" height="130" rx="10" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="265" y="795" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Live CI verification</text>
  <text x="80" y="818" font-size="11" fill="#3b3f45">Pushed to real GitHub repo, opened PR #1</text>
  <text x="80" y="836" font-size="11" fill="#3b3f45">→ workflow triggered, posted the exact</text>
  <text x="80" y="854" font-size="11" fill="#3b3f45">advisory comment, could not merge/write</text>
  <text x="80" y="878" font-size="11" fill="#1e8449" font-weight="700">✓ confirmed, not just inspected</text>

  <!-- Independent review 1 -->
  <rect x="495" y="770" width="410" height="130" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="700" y="795" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Independent review #1</text>
  <text x="515" y="818" font-size="11" fill="#3b3f45">Fresh agent, no prior context, checked</text>
  <text x="515" y="836" font-size="11" fill="#3b3f45">SEED-001 (routing randomness) cold</text>
  <text x="515" y="854" font-size="11" fill="#3b3f45">→ found it one-sided (unused capacity</text>
  <text x="515" y="872" font-size="11" fill="#3b3f45">field = oversight, not real trade-off)</text>
  <text x="515" y="890" font-size="11" fill="#8a1f11" font-weight="700">✗ found &amp; fixed — worker.ts + manifest</text>

  <!-- Independent review 2 -->
  <rect x="930" y="770" width="410" height="130" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="1135" y="795" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Independent review #2</text>
  <text x="950" y="818" font-size="11" fill="#3b3f45">Second fresh agent checked incident-2.sh</text>
  <text x="950" y="836" font-size="11" fill="#3b3f45">(clean) + rollback-plan.md + task-08</text>
  <text x="950" y="854" font-size="11" fill="#3b3f45">→ found rollback doc asserted physical-lab</text>
  <text x="950" y="872" font-size="11" fill="#3b3f45">divergence as fact; nothing in repo models it</text>
  <text x="950" y="890" font-size="11" fill="#8a1f11" font-weight="700">✗ found &amp; fixed — doc + task-08 rubric</text>

  <!-- Security fix -->
  <rect x="60" y="920" width="1280" height="60" rx="10" fill="#fef6e0" stroke="#b7860b" stroke-width="1.5"/>
  <text x="80" y="945" font-size="13" font-weight="700" fill="#1a1d23">Dependency security fix</text>
  <text x="80" y="965" font-size="11" fill="#3b3f45">Dependabot flagged 2 moderate CVEs (qs, transitive via Express) · added npm override to qs@6.16.0 · npm audit: 0 vulnerabilities · re-verified incident-1.sh still passes</text>

  <!-- ============ SECTION 4: DELIVERABLES ============ -->
  <text x="40" y="1020" font-size="16" font-weight="700" fill="#1a1d23">4. What an instructor actually has now</text>

  <g font-size="12">
    <rect x="60" y="1040" width="620" height="180" rx="10" fill="#ffffff" stroke="#d5d9de"/>
    <text x="80" y="1065" font-weight="700" fill="#1a1d23">docs/facilitator-runbook.md</text>
    <text x="80" y="1088" fill="#3b3f45">Day-by-day script: setup steps, timing</text>
    <text x="80" y="1106" fill="#3b3f45">cues, exactly what to reveal/withhold at</text>
    <text x="80" y="1124" fill="#3b3f45">each lab, and which files are answer</text>
    <text x="80" y="1142" fill="#3b3f45">keys never shown to participants</text>
    <text x="80" y="1170" fill="#3b3f45">(seed-manifest.md, calibration-notes.md,</text>
    <text x="80" y="1188" fill="#3b3f45">golden-tasks/*.yaml reference outcomes)</text>
    <text x="80" y="1208" fill="#1e8449" font-weight="700">Post-cohort hygiene documented too</text>

    <rect x="710" y="1040" width="640" height="180" rx="10" fill="#ffffff" stroke="#d5d9de"/>
    <text x="730" y="1065" font-weight="700" fill="#1a1d23">calibration-notes.md</text>
    <text x="730" y="1088" fill="#3b3f45">Full audit trail of the dry run: every</text>
    <text x="730" y="1106" fill="#3b3f45">claim checked against real behavior,</text>
    <text x="730" y="1124" fill="#3b3f45">every bug found + how it was fixed,</text>
    <text x="730" y="1142" fill="#3b3f45">every correction to earlier assumptions</text>
    <text x="730" y="1170" fill="#c0392b" font-weight="700">Still owed: full timed human dry-run</text>
    <text x="730" y="1188" fill="#3b3f45">of Days 1/2/4's pairing / red-team /</text>
    <text x="730" y="1206" fill="#3b3f45">incident-coordination labs (needs a partner)</text>
  </g>

  <!-- footer -->
  <rect x="0" y="1250" width="1400" height="1" fill="#d5d9de"/>
  <text x="700" y="1280" text-anchor="middle" font-size="12" fill="#5b6370">Legend</text>
  <rect x="500" y="1300" width="18" height="18" fill="#fdecea" stroke="#c0392b"/>
  <text x="526" y="1314" font-size="11" fill="#3b3f45">seeded gap / found &amp; fixed issue</text>
  <rect x="500" y="1326" width="18" height="18" fill="#eafaf1" stroke="#1e8449"/>
  <text x="526" y="1340" font-size="11" fill="#3b3f45">verified working as designed</text>
  <rect x="500" y="1352" width="18" height="18" fill="#fef6e0" stroke="#b7860b"/>
  <text x="526" y="1366" font-size="11" fill="#3b3f45">tool surface / dependency work</text>
  <rect x="500" y="1378" width="18" height="18" fill="#ffffff" stroke="#d5d9de"/>
  <text x="526" y="1392" font-size="11" fill="#3b3f45">phase / deliverable record</text>

  <text x="700" y="1440" text-anchor="middle" font-size="11" fill="#8a8f98">v1.0 · github.com/venkatesh-db/rxflow · everything above was run and observed, not just written</text>
</svg>
